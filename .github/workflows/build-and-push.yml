name: Build and Push Images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Git commit SHA used to tag both images"
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read

env:
  FRONTEND_IMAGE: akash24400/marrow-shop-kind-started-frontend
  BACKEND_IMAGE: akash24400/marrow-shop-kind-started-backend

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          passowrd: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
