name: Image Scan

on:
  workflow_call:
    inputs:
      image_tag:
        description: Git commit SHA used to tag the images
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.service }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: docker.io/akash24400/marrow-shop-kind-started-${{ matrix.service }}:${{ inputs.image_tag }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 10m
          skip-dirs: /usr/local/lib/node_modules/npm   # Skiping vulnerabilities if any.