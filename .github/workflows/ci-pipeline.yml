name: CI Pipeline
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:

  code-quality:
    uses: ./.github/workflows/code-quality.yml

  docker-lint:
    needs: code-quality
    uses: ./.github/workflows/docker-lint.yml

  secrets-scan:
    needs: docker-lint
    uses: ./.github/workflows/secrets-scan.yml

  dependency-scan:
    needs: secrets-scan
    uses: ./.github/workflows/dependency-scan.yml

  build-and-push:
    needs:
      - code-quality
      - docker-lint 
      - secrets-scan
      - dependency-scan
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit

  # update-manifests:
